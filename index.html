<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notaciones</title>
    
    <link rel="stylesheet" href="public/css/b5.css" />
    <link rel="stylesheet" href="public/css/main.css" />
    
    <script src="public/js/b5.js"></script>
    <script src="public/js/leader.js"></script>
    <script src="public/js/poper.js"></script>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0">Conversor de Notaciones</h4>
                    </div>
                    <div class="card-body p-4">
                        <p class="text-muted mb-4 text-center">Ingresa tu expresión </p>
                        
                        <div class="input-group mb-4">
                            <input type="text" id="exprInput" class="form-control form-control-lg" placeholder="A+B*C" autocomplete="off">
                            <button class="btn btn-outline-secondary px-4" type="button" id="btnLimpiar">Limpiar</button>
                            <button class="btn btn-primary px-4" type="button" id="btnAnalizar">Analizar</button>
                        </div>

                        <div id="resultados" class="d-none"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="public/js/index.js"></script>
</body>
</html>
